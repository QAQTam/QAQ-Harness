[workspace]
resolver = "2"
members = [
    "crates/qaqh-gate",
    "crates/qaqh-config-api",
    "crates/qaqh-config",
    "crates/qaqh-domain",
    "crates/qaqh-skills",
    "crates/qaqh-message",
    "crates/qaqh-types",
    "crates/qaqh-runtime",
    "crates/qaqh-ringing",
    "crates/qaqh-daemon",
    "crates/qaqh-workspace",
    "crates/qaqh-session",
    "crates/qaqh-subagent",
    "crates/qaqh-client",
    "crates/qaqh-mcp",
]

[workspace.dependencies]
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = "deny"
string_slice = "deny"
