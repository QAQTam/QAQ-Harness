[package]
name = "qaqh-subagent"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness subagent tool — spawn isolated Ringing sub-sessions for focused tasks"

[dependencies]
qaqh-config = { path = "../qaqh-config" }
qaqh-domain = { path = "../qaqh-domain" }
qaqh-ringing = { path = "../qaqh-ringing" }
qaqh-workspace = { path = "../qaqh-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ureq = { version = "3", features = ["json"] }

[lints]
workspace = true
