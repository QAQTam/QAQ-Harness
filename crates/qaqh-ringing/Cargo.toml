[package]
name = "qaqh-ringing"
version.workspace = true
edition.workspace = true
description = "Ringing 线协议层（Wire）：envelope/ack/batch/snapshot/content ref/worker frame/能力协商"

[dependencies]
qaqh-domain = { path = "../qaqh-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"], optional = true }


[features]
ts = ["dep:ts-rs", "qaqh-domain/ts"]

[lints]
workspace = true
