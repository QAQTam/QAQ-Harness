[package]
name = "qaqh-session"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness session manager — singleton, list/load/save/active"

[features]
default = []

[dependencies]
qaqh-types = { path = "../qaqh-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
log = "0.4"
sha2 = "0.11"
hex = "0.4"

[lints.clippy]
unwrap_used = "deny"
# Safe: only 2 string slices — one uses is_char_boundary, one is data eof check.
string_slice = "allow"
