[package]
name = "qaqh-config"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness configuration: provider registry, config load/save"

[features]
default = []

[dependencies]
qaqh-types = { path = "../qaqh-types" }
qaqh-config-api = { path = "../qaqh-config-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
log = "0.4"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
[lints]
workspace = true
