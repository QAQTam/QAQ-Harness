[package]
name = "qaqh-msgloop"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness minimal message loop driver"

[dependencies]
qaqh-gate = { path = "../qaqh-gate" }
qaqh-config = { path = "../qaqh-config" }
qaqh-session = { path = "../qaqh-session" }
qaqh-message = { path = "../qaqh-message" }
qaqh-skills = { path = "../qaqh-skills" }
qaqh-workspace = { path = "../qaqh-workspace" }
qaqh-subagent = { path = "../qaqh-subagent" }
dsh-minimal-mode = { path = "../../dsh-minimal-mode" }
qaqh-proto = { path = "../qaqh-proto" }
qaqh-domain = { path = "../qaqh-domain" }
qaqh-ringing = { path = "../qaqh-ringing" }
qaqh-types = { path = "../qaqh-types" }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_WinRT", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "UI_Notifications", "Data_Xml_Dom", "Foundation_Collections"] }

[lints]
workspace = true

[features]
# Kept as a compatibility no-op after removing the experimental vector backend.
memory = []

[dev-dependencies]
tempfile = "3"
os_pipe = "1"
tiny_http = "0.12"
