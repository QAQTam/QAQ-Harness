[package]
name = "qaqh-daemon"
version.workspace = true
edition.workspace = true
description = "Headless QAQ-Harness application daemon"
build = "build.rs"

[dependencies]
qaqh-config = { path = "../qaqh-config" }
qaqh-proto = { path = "../qaqh-proto" }
qaqh-domain = { path = "../qaqh-domain" }
qaqh-ringing = { path = "../qaqh-ringing" }
qaqh-runtime = { path = "../qaqh-runtime" }
qaqh-subagent = { path = "../qaqh-subagent" }
qaqh-session = { path = "../qaqh-session" }
qaqh-types = { path = "../qaqh-types" }
log = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# axum migration P0 scaffolding (feature-gated, default off to keep winui stability)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["trace", "fs", "limit", "cors", "set-header", "util"] }
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["memory"]
memory = ["qaqh-runtime/memory"]
axum = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio-stream", "dep:futures-util"]

[lints]
workspace = true
