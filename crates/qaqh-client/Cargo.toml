[package]
name = "qaqh-client"
version.workspace = true
edition = "2024"
description = "QAQ-Harness Ringing V1 daemon client (HTTP/SSE) — shared by TUI and desktop shells"
license = "MIT"

[dependencies]
bytes = "1"
qaqh-domain = { path = "../qaqh-domain" }
qaqh-ringing = { path = "../qaqh-ringing" }
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
