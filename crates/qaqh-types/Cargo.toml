[package]
name = "qaqh-types"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness shared type definitions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"], optional = true }
sha2 = "0.11"
toml = "1.1"
tokenizers = { version = "0.23", optional = true }

[features]
# web 端 TS 类型生成（ts-rs，单一真相）：config-revamp C1 同款 feature-gate，默认关
ts = ["dep:ts-rs"]
default = ["tokenizers"]
tokenizers = ["dep:tokenizers"]

[lints]
workspace = true
